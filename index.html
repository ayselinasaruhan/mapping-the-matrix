<!DOCTYPE html>
<html>
<head>
    <title>Massive Citation Universe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; font-family: sans-serif; overflow: hidden; }
        #cy { width: 100vw; height: 100vh; display: block; }
        #tooltip {
            position: absolute; background: rgba(0, 0, 0, 0.85); color: #fff;
            padding: 10px; border-radius: 5px; font-size: 12px; max-width: 300px;
            pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 999;
            border: 1px solid #555; white-space: pre-line;
        }
    </style>
</head>
<body>
    <div id="tooltip"></div>
    <div id="cy"></div>

    <script src="network_data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof graphElements === 'undefined' || graphElements.length === 0) {
                document.body.innerHTML = "<h2 style='color:white; text-align:center; margin-top:20%;'>⚠️ network_data.js missing or empty! Run generate_web_data.py first.</h2>";
                return;
            }

            const cy = cytoscape({
                container: document.getElementById('cy'),
                elements: graphElements,
                style: [
                    { selector: 'node', style: { 'background-color': '#4EA8DE', 'width': 4, 'height': 4 } },
                    { selector: 'node[type="hub"]', style: { 'background-color': '#E63946', 'width': 25, 'height': 25, 'label': 'data(label)', 'color': '#fff', 'font-size': 10, 'text-valign': 'center' } },
                    { selector: 'node[type="shared"]', style: { 'background-color': '#FFB703', 'width': 8, 'height': 8 } },
                    { 
                        selector: 'edge', 
                        style: { 
                            'width': 0.4, 
                            'line-color': '#555555', 
                            'opacity': 0.12, 
                            'curve-style': 'haystack' 
                        } 
                    }
                ],
                // 🚀 FIX #1: Tell preset layout to automatically adjust fit and padding on start
                layout: { 
                    name: 'preset',
                    fit: true,
                    padding: 50
                }
            });

            // 🏎️ Navigation optimization
            // Hide lines completely during zoom/drag for instant responsive speed
            cy.on('viewport', function() { 
                cy.edges().style('display', 'none'); 
            });
            
            let timeout;
            cy.on('pan zoom', function() {
                clearTimeout(timeout);
                timeout = setTimeout(function() { 
                    // 🚀 FIX #2: Changed invalid 'element' value to 'element-delayed' or 'visible'
                    cy.edges().style('display', 'visible'); 
                }, 200); 
            });

            // Tooltips
            const tooltip = document.getElementById('tooltip');
            cy.on('mouseover', 'node', (e) => {
                const node = e.target;
                if(node.data('tooltip')) {
                    tooltip.innerHTML = node.data('tooltip');
                    tooltip.style.opacity = 1;
                }
            });
            cy.on('mousemove', 'node', (e) => {
                tooltip.style.left = (e.renderedPosition.x + 15) + 'px';
                tooltip.style.top = (e.renderedPosition.y + 15) + 'px';
            });
            cy.on('mouseout', 'node', () => { tooltip.style.opacity = 0; });
        });
    </script>
</body>
</html>
