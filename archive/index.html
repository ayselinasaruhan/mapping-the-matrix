<!DOCTYPE html>
<html>
<head>
    <title>Massive Citation Universe</title>
    <script>
        function showError(message) {
            document.body.innerHTML = "<h2 style='color:white; text-align:center; margin-top:20%; padding: 0 20px;'>⚠️ " + message + "</h2>";
        }
    </script>
    <script src="cytoscape.min.js" onerror="showError('Unable to load local Cytoscape file. Make sure cytoscape.min.js is in the same folder as index.html.')"></script>
    <script src="network_data.js" onerror="showError('Unable to load network_data.js. Run generate_web_data.py and open this page through a local web server.')"></script>
    
    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; font-family: sans-serif; overflow: hidden; color: white; }
        #cy { width: 100vw; height: 100vh; display: block; position: absolute; left: 0; top: 0; background: #111; border: 1px solid #333; }
        #tooltip {
            position: absolute; background: rgba(0, 0, 0, 0.85); color: #fff;
            padding: 10px; border-radius: 5px; font-size: 12px; max-width: 300px;
            pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 999;
            border: 1px solid #555; white-space: pre-line;
        }
        #status {
            position: absolute; left: 0; top: 0; width: 100%; padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7); color: #fff; font-size: 14px; z-index: 1000;
            box-sizing: border-box; pointer-events: none;
        }

        /* --- SLEEK STORYTELLING SIDEBAR --- */
        #sidebar {
            position: fixed;
            top: 20px;
            right: -420px; /* Hidden off-screen by default */
            width: 380px;
            height: calc(100vh - 40px);
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #f0f0f0;
            padding: 25px;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1); /* Ultra smooth slide */
            z-index: 1000;
            overflow-y: auto;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #sidebar.open {
            right: 20px; /* Slides smoothly into position */
        }

        #sidebar-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
        }

        #sidebar-close:hover { color: #fff; }
        #sidebar-content h2 { margin-top: 0; color: #E63946; font-size: 1.4rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        #sidebar-content h3 { color: #FFB703; font-size: 1rem; margin-top: 20px; }
        #sidebar-content p { font-size: 0.95rem; line-height: 1.5; color: #ccc; }
    </style>
</head>
<body>
    <div id="status">Loading graph... (If nothing changes, check network/devtools)</div>
    <div id="tooltip"></div>
    <div id="cy"></div>

    <div id="sidebar">
        <button id="sidebar-close">&times;</button>
        <div id="sidebar-content">
            <h2>🔬 Research Cluster</h2>
            <p>Select a core hub node to read the AI narrative summary of this era.</p>
        </div>
    </div>

    <script>
        function updateStatus(message) {
            const el = document.getElementById('status');
            if (el) el.textContent = message;
            console.log('[graph status] ' + message);
        }

        window.addEventListener('error', function(event) {
            updateStatus('JavaScript error: ' + event.message);
            console.error(event.error || event.message);
        });

        document.addEventListener("DOMContentLoaded", function() {
            updateStatus('DOM loaded. Checking dependencies...');

            if (typeof cytoscape === 'undefined') {
                showError('Cytoscape did not load. Make sure cytoscape.min.js is in the same folder as index.html.');
                return;
            }
            updateStatus('Cytoscape loaded. Checking graph data...');

            if (typeof graphElements === 'undefined' || graphElements.length === 0) {
                showError('network_data.js is missing or empty. Run generate_web_data.py and reload the page from the project folder.');
                return;
            }
            updateStatus('Graph data loaded. Initializing Cytoscape...');

            const cy = cytoscape({
                container: document.getElementById('cy'),
                elements: graphElements,
                pan: { x: window.innerWidth / 2, y: window.innerHeight / 2 },
                style: [
                    { selector: 'node', style: { 'background-color': '#4EA8DE', 'width': 12, 'height': 12 } },
                    { selector: 'node[type="hub"]', style: { 'background-color': '#E63946', 'width': 30, 'height': 30, 'label': 'data(label)', 'color': '#fff', 'font-size': 10, 'text-valign': 'center' } },
                    { selector: 'node[type="shared"]', style: { 'background-color': '#FFB703', 'width': 16, 'height': 16 } },
                    { selector: 'node[id="debug-node"]', style: { 'background-color': '#00FF00', 'width': 40, 'height': 40, 'label': 'data(label)', 'color': '#000', 'font-size': 12, 'text-valign': 'center', 'text-halign': 'center' } },
                    { 
                        selector: 'edge', 
                        style: { 
                            'width': 2, 
                            'line-color': '#BBBBBB', 
                            'opacity': 0.3, 
                            'curve-style': 'bezier' 
                        } 
                    }
                ],
                layout: {
                    name: 'preset',
                    fit: true,
                    padding: 30
                }
            });

            const firstHub = cy.nodes('[type="hub"]').first();
            if (firstHub.length > 0) {
                cy.zoom(0.5);          
                cy.center(firstHub);   
            }

            updateStatus('Cytoscape initialized. Nodes: ' + cy.nodes().length + ', Edges: ' + cy.edges().length);
            console.log('[graph ready] nodes', cy.nodes().length, 'edges', cy.edges().length);
            cy.resize();
            cy.fit(20);
            cy.center();

            const debugNode = cy.add({ data: { id: 'debug-node', label: 'DEBUG' }, position: { x: 0, y: 0 } });
            cy.add({ data: { id: 'debug-edge', source: 'debug-node', target: cy.nodes()[0].id() } });

            cy.zoom(0.4);
            cy.pan({ x: 0, y: 0 });
            cy.center();
            updateStatus('Graph rendered. Debug node added at (0,0). If you still see nothing, the container may be hidden.');
            
            // --- HOVER SYSTEM ---
            const tooltip = document.getElementById('tooltip');

            // 1. Trigger when mouse enters a node (with a soft boundary)
            cy.on('mouseover', 'node', function(evt) {
                const node = evt.target;
                
                tooltip.innerHTML = node.data('tooltip') || node.data('id');
                tooltip.style.opacity = 1;
                
                // Slightly scale up the node so the user gets visual feedback
                node.style({
                    'transform': 'scale(1.5)',
                    'transition-property': 'transform',
                    'transition-duration': '0.1s'
                });
            });

            // 2. Track the mouse movement smoothly so the tooltip floats next to it
            cy.on('mousemove', function(evt) {
                if (tooltip.style.opacity == 1) {
                    tooltip.style.left = (evt.renderedPosition.x + 18) + 'px';
                    tooltip.style.top = (evt.renderedPosition.y + 18) + 'px';
                }
            });

            // 3. Hide the tooltip instantly when the mouse leaves the node's area
            cy.on('mouseout', 'node', function(evt) {
                const node = evt.target;
                tooltip.style.opacity = 0;
                
                // Return node to its normal size
                node.removeStyle(); 
            });

            // 4. Give the mouse a generous grab-radius area (Proximity Selection)
            // This makes it so your big cursor doesn't have to be exactly on the 4px dot!
            cy.on('mousemove', function(evt) {
                const mousePos = evt.position; // Get current mouse coordinates in model space
                let closestNode = null;
                let minDistance = 35; // This is your magnetic grab-radius in pixels. Raise it if needed!

                // Safely loop through every single node to find what's near the cursor
                cy.nodes().forEach(function(node) {
                    const nodePos = node.position();
                    const distance = Math.sqrt(
                        Math.pow(mousePos.x - nodePos.x, 2) + 
                        Math.pow(mousePos.y - nodePos.y, 2)
                    );
                    
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestNode = node;
                    }
                });

                // If we found a node close enough, fake a smooth hover event!
                if (closestNode) {
                    const currentTxt = tooltip.innerHTML;
                    const newTxt = closestNode.data('tooltip') || closestNode.data('id');
                    
                    if (currentTxt !== newTxt) {
                        cy.nodes().removeStyle(); // Clear any old scaled-up nodes
                        closestNode.trigger('mouseover');
                    }
                }
            });
            // ----------------------------------------

            // --- SIDEBAR INTERACTION LOGIC ---
            const sidebar = document.getElementById('sidebar');
            const sidebarContent = document.getElementById('sidebar-content');
            const sidebarClose = document.getElementById('sidebar-close');

            // Trigger when a user clicks/taps a core hub node
            cy.on('tap', 'node[type="hub"]', function(evt) {
                const node = evt.target;
                const hubId = node.data('id');
                const label = node.data('label') || hubId;
                
                // Safely look for the summary data, or use a placeholder if it isn't generated yet
                const summaryText = node.data('summary') || "<ul><li>[AI Analysis Pending for this cluster]</li></ul>";
                
                sidebarContent.innerHTML = `
                    <h2>🔬 Core Hub: ${label}</h2>
                    <p><b>ID:</b> ${hubId}</p>
                    
                    <h3>💡 Timeline Context</h3>
                    <p>This cluster represents a key evolutionary step in the timeline. The papers surrounding this hub evaluate its core concepts and build upon them.</p>
                    
                    <h3>🤖 Gemini AI Narrative Summary</h3>
                    <div style="line-height: 1.6; color: #e0e0e0;">
                        ${summaryText}
                    </div>
                `;
                
                sidebar.classList.add('open');
            });

            // Close sidebar when clicking the "X" button
            sidebarClose.addEventListener('click', function() {
                sidebar.classList.remove('open');
            });

            // Close sidebar if clicking the blank background canvas
            cy.on('tap', function(evt) {
                if (evt.target === cy) {
                    sidebar.classList.remove('open');
                }
            });

            // Close sidebar if clicking the blank background canvas
            cy.on('tap', function(evt) {
                if (evt.target === cy) {
                    sidebar.classList.remove('open');
                }
            });

            cy.on('tap', function(evt){
                if(evt.target === cy){
                    tooltip.style.opacity = 0;
                }
            });
        });
    </script>
</body>
</html>
